name: CI
on:
  push:
    branches: [main, hds-scientific-provenance]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m compileall app scripts tests
      - run: python scripts/migrate.py
      - run: python -m pytest -q
      - run: git diff --check

  postgres-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hds_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hds_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/postgres_smoke.py
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hds_ci
          PYTHONPATH: .


  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: hds-ci:latest
      - run: docker compose -f docker-compose.production.yml config
        env:
          POSTGRES_DB: hds_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hds_ci
          HDS_AUTH_HMAC_SECRET: ci-only-secret
