services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      COMPANY_OS_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      HDS_AUTH_HMAC_SECRET: ${HDS_AUTH_HMAC_SECRET:?set HDS_AUTH_HMAC_SECRET}
      HDS_OWNER_EXTERNAL_SUBJECT: ${HDS_OWNER_EXTERNAL_SUBJECT:?set HDS_OWNER_EXTERNAL_SUBJECT}
    command: ["python", "scripts/migrate.py"]

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      COMPANY_OS_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      HDS_AUTH_HMAC_SECRET: ${HDS_AUTH_HMAC_SECRET:?set HDS_AUTH_HMAC_SECRET}
      HDS_CODE_RUNNER_MODE: isolated
      COMPANY_OS_LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - code_worker_jobs:/var/lib/hds-code-worker
      - code_worker_results:/var/lib/hds-code-worker-results
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  code-worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: "no"
    network_mode: "none"
    read_only: true
    cpus: "1.0"
    mem_limit: 512m
    pids_limit: 64
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      HDS_WORKER_NETWORK: none
      HDS_WORKER_SHARED_DIR: /var/lib/hds-code-worker
      HDS_WORKER_RESULT_DIR: /var/lib/hds-code-worker-results
    volumes:
      - code_worker_jobs:/var/lib/hds-code-worker
      - code_worker_results:/var/lib/hds-code-worker-results

volumes:
  postgres_data:
  code_worker_jobs:
  code_worker_results:
